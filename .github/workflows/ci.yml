name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore N1che.slnx

      - name: Check formatting
        run: dotnet format N1che.slnx --no-restore --verify-no-changes

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore tests/N1che.Domain.UnitTests

      - name: Build
        run: dotnet build tests/N1che.Domain.UnitTests --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test tests/N1che.Domain.UnitTests --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --results-directory test-results

      - name: Report test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Unit test results
          path: test-results/*.trx
          reporter: dotnet-trx

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results

  service-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore tests/N1che.ServiceTests

      - name: Build
        run: dotnet build tests/N1che.ServiceTests --no-restore --configuration Release

      # Testcontainers starts PostGIS on the runner's Docker daemon.
      - name: Test
        run: >
          dotnet test tests/N1che.ServiceTests --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --results-directory test-results

      - name: Report test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Service test results
          path: test-results/*.trx
          reporter: dotnet-trx

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-test-results
          path: test-results
