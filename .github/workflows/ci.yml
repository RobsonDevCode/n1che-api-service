name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore N1che.slnx

      - name: Check formatting
        run: dotnet format N1che.slnx --no-restore --verify-no-changes

  service-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore N1che.slnx

      - name: Build
        run: dotnet build N1che.slnx --no-restore --configuration Release

      # Testcontainers starts PostGIS on the runner's Docker daemon.
      - name: Test
        run: >
          dotnet test N1che.slnx --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --results-directory test-results

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
